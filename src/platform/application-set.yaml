apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/tracking-id: default:argoproj.io/Application:argo-cd/platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/instance: platform
    app.kubernetes.io/part-of: main
    app.kubernetes.io/managed-by: argo-cd
spec:
  goTemplate: true
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true # Preserve resources on deletion to avoid accidental data loss
  generators:
    - list:
        elements:
        # CORE
        - name: argo-cd
          component: core
          wave: 0
        - name: cert-manager
          component: core
          wave: 10
        - name: hami
          component: core
          wave: 20
        - name: nvidia-operator
          component: core
          wave: 10
          ignoreDifferences:
            - group: nvidia.com
              kind: ClusterPolicy
              name: cluster-policy
              jsonPointers:
                - /spec/migManager/config/name
        - name: system-upgrade
          component: core
          wave: 10
        - name: system-upgrade-plans
          component: core
          wave: 20

        # NETWORK
        - name: cilium
          component: network
          wave: -20
          ignoreDifferences:
            - group: ''
              kind: Secret
              name: cilium-ca
              jsonPointers:
                - /data/ca.crt
                - /data/ca.key
            - group: ''
              kind: Secret
              name: hubble-server-certs
              jsonPointers:
                - /data/ca.crt
                - /data/tls.crt
                - /data/tls.key
        - name: letsencrypt
          component: network
          wave: 20

        # OBSERVABILITY
        - name: kube-prometheus-stack
          component: observability
          wave: 20
          ignoreDifferences:
            - group: apps
              kind: Deployment
              jqPathExpressions:
                - .spec.template.metadata.annotations."checksum/secret"
            - kind: Secret
              jsonPointers:
                - /data/admin-password
                - /data/ldap-toml
        - name: loki
          component: observability
          wave: 20
        - name: promtail
          component: observability
          wave: 20

        # SECURITY
        - name: authentik
          component: security
          wave: 20
          ignoreDifferences:
            - group: ''
              kind: Secret
              name: authentik-postgresql
              jsonPointers:
                - /data/password
                - /data/postgres-password
            - group: apps
              kind: StatefulSet
              jqPathExpressions:
              - '.spec.volumeClaimTemplates[]'
        - name: external-secrets
          component: security
          wave: 10
        - name: secrets-integrator
          component: security
          wave: 20
        
        # STORAGE
        - name: harbor
          component: storage
          wave: 30
          ignoreDifferences:
            - group: ''
              kind: Secret
              name: harbor-core
              jsonPointers:
                - /data/CSRF_KEY
                - /data/secret
                - /data/tls.crt
                - /data/tls.key
            - group: ''
              kind: Secret
              name: harbor-database
              jsonPointers:
                - /data/POSTGRES_PASSWORD
            - group: ''
              kind: Secret
              name: harbor-jobservice
              jsonPointers:
                - /data/JOBSERVICE_SECRET
            - group: ''
              kind: Secret
              name: harbor-registry
              jsonPointers:
                - /data/REGISTRY_HTTP_SECRET
            - group: ''
              kind: Secret
              name: harbor-registry-htpasswd
              jsonPointers:
                - /data/REGISTRY_HTPASSWD
            - group: apps
              kind: Deployment
              jqPathExpressions:
                - .spec.template.metadata.annotations."checksum/secret"
                - .spec.template.metadata.annotations."checksum/secret-core"
                - .spec.template.metadata.annotations."checksum/secret-jobservice"
            - group: apps
              kind: StatefulSet
              jqPathExpressions:
              - '.spec.volumeClaimTemplates[]'
        - name: longhorn
          component: storage
          wave: 20
          ignoreDifferences:
            - group: apiextensions.k8s.io
              kind: CustomResourceDefinition
              jqPathExpressions:
                - .spec.preserveUnknownFields
        - name: nfs-provisioner
          component: storage
          wave: 20
        - name: postgres
          component: storage
          wave: 30
        - name: qdrant
          component: storage
          wave: 30
          ignoreDifferences:
            - group: apps
              kind: StatefulSet
              jqPathExpressions:
              - '.spec.volumeClaimTemplates[]'
  template:
    metadata:
      name: '{{ .name }}'
      annotations:
        argocd.argoproj.io/tracking-id: platform:argoproj.io/Application:argo-cd/{{ .component }}/{{ .name }}
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/instance: '{{ .name }}'
        app.kubernetes.io/component: '{{ .component }}'
        app.kubernetes.io/part-of: platform
    spec:
      project: platform
      source:
        repoURL: https://github.com/Kube-Mind/fleet-infra.git
        targetRevision: main
        path: 'src/platform/{{ .component }}/{{ .name }}'
        kustomize: {} # Let Kustomize handle naming
      destination:
        namespace: '{{ .name }}'
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - PruneLast=true
          - RespectIgnoreDifferences=true
  templatePatch: |
    {{- if hasKey . "ignoreDifferences" }}
    {{- if .ignoreDifferences }}
    spec:
      ignoreDifferences:
      {{- toYaml .ignoreDifferences | nindent 8 }}
    {{- end }}
    {{- end }}