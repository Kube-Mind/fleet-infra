#         key: platform/storage/qdrant
#         metadataPolicy: None
#         nullBytePolicy: Ignore
#         property: QDRANT_SERVICE_API_KEY
#       secretKey: QDRANT_SERVICE_API_KEY
#   refreshInterval: 15s
#   secretStoreRef:
#     kind: ClusterSecretStore
#     name: vault
#   target:
