---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: backup-regular
  namespace: longhorn
spec:
  cron: "0 6 * * 6"   # Runs every Saturday at 6:00 AM.
  task: "backup"
  groups:
    - default
    - group1
  retain: 18  # 3 days worth (6 backups/day × 3 days)
  concurrency: 3
  labels:
    type: resource-friendly
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
  namespace: longhorn
spec:
  cron: "0 12 * * 6" # Runs every Saturday at 12:00 PM (noon).
  task: "snapshot-cleanup"
  groups:
    - default
    - group1
  concurrency: 2
  labels:
    type: maintenance
