apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/tracking-id: main:argoproj.io/Application:argo-cd/platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/instance: 'platform'
    app.kubernetes.io/part-of: main
    app.kubernetes.io/managed-by: argo-cd
spec:
  description: Project for platform applications
  sourceRepos:
    - 'https://github.com/Kube-Mind/fleet-infra.git'
    - 'https://charts.longhorn.io'
  destinations:
    # COMMON
    - namespace: 'kube-system'
      server: '*'
    # CORE
    - namespace: 'argo-cd'
      server: '*'
    - namespace: 'cert-manager'
      server: '*'
    - namespace: 'hami'
      server: '*'
    - namespace: 'nvidia-operator'
      server: '*'
    - namespace: 'system-upgrade'
      server: '*'
    - namespace: 'system-upgrade-plans'
      server: '*'
    # NETWORK
    - namespace: 'cert-manager'
      server: '*'
    - namespace: 'external-dns'
      server: '*'
    - namespace: 'cilium'
      server: '*'
    - namespace: 'cilium-secrets'
      server: '*'
    - namespace: 'letsencrypt'
      server: '*'
    - namespace: 'secrets-integrator'
      server: '*'
    # OBSERVABILITY
    - namespace: 'kube-prometheus-stack'
      server: '*'
    - namespace: 'loki'
      server: '*'
    - namespace: 'promtail'
      server: '*'
    # SECURITY
    - namespace: 'authentik'
      server: '*'
    - namespace: 'external-secrets'
      server: '*'
    - namespace: 'secrets-integrator'
      server: '*'
    # STORAGE
    - namespace: 'harbor'
      server: '*'
    - namespace: 'longhorn'
      server: '*'
    - namespace: 'nfs-provisioner'
      server: '*'
    - namespace: 'postgres'
      server: '*'
    - namespace: 'qdrant'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'