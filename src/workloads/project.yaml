apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argo-cd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/tracking-id: main:argoproj.io/Application:argo-cd/workloads
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/instance: 'workloads'
    app.kubernetes.io/part-of: main
    app.kubernetes.io/managed-by: argo-cd
spec:
  description: Project for workloads applications
  sourceRepos:
    # Internal
    - 'https://github.com/Kube-Mind/fleet-infra.git'
    - 'https://gitlab.com/Kube-Mind/dnsfix.git'
    - 'https://github.com/Kube-Mind/stable-diffusion-webui.git'
    # External
    - 'https://gitlab.com/ska-telescope/pst/ska-pst.git'
    - 'https://github.com/fourier-space-au/pft.git'
  destinations:
    # External
    - namespace: 'argo-cd'
      server: '*'
    - namespace: 'kube-system'
      server: '*'
    # AI
    - namespace: 'litellm'
      server: '*'
    - namespace: 'ollama'
      server: '*'
    - namespace: 'open-webui'
      server: '*'
    - namespace: 'sd-comfyui'
      server: '*'
    - namespace: 'vllm'
      server: '*'

    # CI
    - namespace: 'argo-workflows'
      server: '*'
    - namespace: 'github-runner'
      server: '*'
    - namespace: 'gitlab-runner'
      server: '*'

    # Demo
    - namespace: 'django-tutorial'
      server: '*'

    # Messaging
    - namespace: 'kafka'
      server: '*'
    - namespace: 'rabbitmq'
      server: '*'
    - namespace: 'rabbitmq-system'
      server: '*'

    # Tools
    - namespace: 'cluster-maintenance'
      server: '*'
    - namespace: 'dnsfix'
      server: '*'
    - namespace: 'jupyterhub'
      server: '*'
    - namespace: 'n8n'
      server: '*'

    # Work
    - namespace: 'ska'
      server: '*'
    - namespace: 'tropic'
      server: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'