# ---
# apiVersion: external-secrets.io/v1
# kind: ExternalSecret
# metadata:
#   name: browserless-proxy-external-secret
#   namespace: ollama
# spec:
#   data:
#     - remoteRef:
#         conversionStrategy: Default
#         decodingStrategy: None
#         key: workloads/ai/browserless-proxy
#         metadataPolicy: None
#         nullBytePolicy: Ignore
#         property: BROWSERLESS_TOKEN
#       secretKey: BROWSERLESS_TOKEN
#   refreshInterval: 15s
#   secretStoreRef:
#     kind: ClusterSecretStore
#     name: vault
#   target:
#     creationPolicy: Owner
#     deletionPolicy: Retain
#     name: browserless-proxy-external-secret
#     template:
#       engineVersion: v2
#       mergePolicy: Replace
#       metadata:
#         labels:
#           app.kubernetes.io/part-of: argocd
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browserless-proxy-external-secret
  namespace: ollama
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-secretsstore
    kind: ClusterSecretStore
  target:
    name: browserless-proxy-external-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: BROWSERLESS_TOKEN
      remoteRef:
        key: TROPIC.BROWSERLESS_TOKEN
# ---
# apiVersion: external-secrets.io/v1
# kind: ExternalSecret
# metadata:
#   name: ollama-proxy-external-secret
#   namespace: ollama
# spec:
#   data:
#     - remoteRef:
#         conversionStrategy: Default
#         decodingStrategy: None
#         key: workloads/ai/ollama-proxy
#         metadataPolicy: None
#         nullBytePolicy: Ignore
#         property: TROPIC_API_KEY
#       secretKey: TROPIC_API_KEY
#   refreshInterval: 15s
#   secretStoreRef:
#     kind: ClusterSecretStore
#     name: vault
#   target:
#     creationPolicy: Owner
#     deletionPolicy: Retain
#     name: ollama-proxy-external-secret
#     template:
#       engineVersion: v2
#       mergePolicy: Replace
#       metadata:
#         labels:
#           app.kubernetes.io/part-of: argocd
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ollama-proxy-external-secret
  namespace: ollama
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: bitwarden-secretsstore
    kind: ClusterSecretStore
  target:
    name: ollama-proxy-external-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: TROPIC_API_KEY
      remoteRef:
        key: TROPIC.API_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: regcred-external-secret
  namespace: ollama
spec:
  data:
    - secretKey: base64Regcred
      remoteRef:
        conversionStrategy: Default	
        decodingStrategy: None
        key: platform/storage/harbor
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: regcred
  refreshInterval: 15s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: regcred-external-secret
    template:
      data:
        .dockerconfigjson: '{{ .base64Regcred | toString }}'
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson