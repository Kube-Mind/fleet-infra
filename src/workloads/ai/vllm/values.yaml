# -- Optional runtime AI inventory (k8s-aibom). When enabled, a
# lightweight, unprivileged controller generates a CycloneDX 1.6 ML-BOM
# for AI workloads in namespaces labeled aibom.k8saibom.dev/enabled=true
# — including the vLLM deployments this chart manages. Disabled by
# default; nothing is inventoried without both this flag and the
# namespace opt-in label.
k8s-aibom:
  enabled: false

