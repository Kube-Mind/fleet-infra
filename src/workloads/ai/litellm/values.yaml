fullnameOverride: "litellm"

liteadmin:
  backendUrl: "http://litellm-gateway:4000"

masterKey:
  secretName: litellm-external-secret
  secretKey: masterkey

database:
  writer:
    host: "litellm-postgres-rw"
    port: 5432
    dbname: litellm
    passwordSecret:
      name: litellm-external-secret
      usernameKey: username
      passwordKey: password

redis:
  host: "litellm-redis"
  port: 6379
  passwordSecret:
    name: litellm-external-secret
    passwordKey: REDIS_PASSWORD

# One host fronting gateway, backend, and ui
ingress:
  enabled: true
  className: "cilium"
  annotations:
    cert-manager.io/cluster-issuer: le-ing-prd
    ingress.cilium.io/loadbalancer-mode: shared
    ingress.cilium.io/websocket: "enabled"
  host: "llm.jcan.dev"
  tls:
    - secretName: litellm-ingress-tls
      hosts:
        - llm.jcan.dev

# LLM data plane
gateway:
  envSecrets:
    - litellm-external-secret

  config:
    proxy_config:
      model_list:
        - model_name: qwen3-coder
          litellm_params:
            model: hosted_vllm/avyukth/Qwen3.8-27B-AWQ-INT4
            api_base: "http://vllm-qwen3-27b-engine-service.vllm.svc.cluster.local:80/v1"
        - model_name: qwen2-general
          litellm_params:
            model: hosted_vllm/Qwen/Qwen2.5-3B-Instruct-AWQ
            api_base: "http://vllm-qwen-general-engine-service.vllm.svc.cluster.local:80/v1"
        # - model_name: gpt-oss-20b
        #   litellm_params:
        #     model: hosted_vllm/openai/gpt-oss-20b
        #     api_base: "http://vllm-gpt-oss-20b-engine-service.vllm.svc.cluster.local:80/v1"
        # - model_name: qwen2-coder
        #   litellm_params:
        #     model: hosted_vllm/Qwen/Qwen2.5-Coder-7B-Instruct-AWQ
        #     api_base: "http://vllm-qwen2-coder-engine-service.vllm.svc.cluster.local:80/v1"

        # - model_name: devstral
        #   litellm_params:
        #     model: hosted_vllm/mistralai/Devstral-Small-2-24B-Instruct-2512
        #     api_base: "http://vllm-devstral-engine-service.vllm.svc.cluster.local:80/v1"

        # - model_name: starcoder
        #   litellm_params:
        #     model: hosted_vllm/bigcode/starcoder2-3b
        #     api_base: "http://vllm-starcoder-engine-service.vllm.svc.cluster.local:80/v1"

        # - model_name: bge-small
        #   litellm_params:
        #     model: hosted_vllm/BAAI/bge-small-en-v1.5
        #     api_base: "http://vllm-bge-small-engine-service.vllm.svc.cluster.local:80/v1"

# Management API / SSO
backend:
  envSecrets:
    - litellm-external-secret

  logLevel: DEBUG

  extraEnv:
    - name: QDRANT_API_BASE
      value: "http://qdrant.qdrant.svc.cluster.local:6333"
    - name: QDRANT_API_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-external-secret
          key: QDRANT_SERVICE_API_KEY

    # Authentik OIDC
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: "https://auth.jcan.dev/application/o/authorize/"

    - name: GENERIC_TOKEN_ENDPOINT
      value: "https://auth.jcan.dev/application/o/token/"

    - name: GENERIC_USERINFO_ENDPOINT
      value: "https://auth.jcan.dev/application/o/userinfo/"

    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-external-secret
          key: GENERIC_CLIENT_ID

    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-external-secret
          key: GENERIC_CLIENT_SECRET

    - name: GENERIC_SCOPE
      value: "openid profile email groups"

    - name: GENERIC_USER_ID_ATTRIBUTE
      value: "sub"

    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: "email"

    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: "name"

    # Authentik group -> LiteLLM role
    - name: GENERIC_ROLE_MAPPINGS_GROUP_CLAIM
      value: "groups"

    - name: GENERIC_ROLE_MAPPINGS_ROLES
      value: '{"proxy_admin":["LiteLLM Admins"]}'

    - name: GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE
      value: "internal_user"

    # Public URL
    - name: PROXY_BASE_URL
      value: "https://llm.jcan.dev"

    # Automatically redirect UI login to Authentik
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"

    - name: LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT
      value: "true"

    - name: LITELLM_MODE
      value: "PRODUCTION"