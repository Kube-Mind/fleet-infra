fullnameOverride: "litellm"

liteadmin:
  backendUrl: "http://litellm-gateway:4000"

masterKey:
  secretName: litellm-external-secret
  secretKey: masterkey

database:
  writer:
    host: "litellm-postgres-rw:5432/litellm"
    port: 5432
    dbname: litellm
    passwordSecret:
      name: litellm-external-secret
      usernameKey: username
      passwordKey: password

redis:
  host: "litellm-redis"
  port: 6379
  passwordSecret:
    name: litellm-external-secret
    passwordKey: REDIS_PASSWORD

# One host fronting gateway, backend, and ui
ingress:
  enabled: true
  className: "cilium"
  annotations:
    cert-manager.io/cluster-issuer: le-ing-prd
    ingress.cilium.io/loadbalancer-mode: shared
    ingress.cilium.io/websocket: "enabled"
  host: "llm.jcan.dev"
  tls:
    - secretName: litellm-ingress-tls
      hosts:
        - llm.jcan.dev

# LLM data plane
gateway:
  envSecrets:
    - litellm-external-secret

  config:
    proxy_config:
      model_list:
        - model_name: qwen3-14b
          litellm_params:
            model: hosted_vllm/Qwen/Qwen3-14B-AWQ
            api_base: "http://vllm-qwen3-engine-service.vllm.svc.cluster.local:80/v1"

# Management API / SSO
backend:
  envSecrets:
    - litellm-external-secret

  logLevel: DEBUG

  extraEnv:
    # Authentik OIDC
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: "https://auth.jcan.dev/application/o/authorize/"

    - name: GENERIC_TOKEN_ENDPOINT
      value: "https://auth.jcan.dev/application/o/token/"

    - name: GENERIC_USERINFO_ENDPOINT
      value: "https://auth.jcan.dev/application/o/userinfo/"

    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-external-secret
          key: GENERIC_CLIENT_ID

    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-external-secret
          key: GENERIC_CLIENT_SECRET

    - name: GENERIC_SCOPE
      value: "openid profile email groups"

    - name: GENERIC_USER_ID_ATTRIBUTE
      value: "sub"

    - name: GENERIC_USER_EMAIL_ATTRIBUTE
      value: "email"

    - name: GENERIC_USER_DISPLAY_NAME_ATTRIBUTE
      value: "name"

    # Authentik group -> LiteLLM role
    - name: GENERIC_ROLE_MAPPINGS_GROUP_CLAIM
      value: "groups"

    - name: GENERIC_ROLE_MAPPINGS_ROLES
      value: '{"proxy_admin":["LiteLLM Admins"]}'

    - name: GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE
      value: "internal_user"

    # Public URL
    - name: PROXY_BASE_URL
      value: "https://llm.jcan.dev"

    # Automatically redirect UI login to Authentik
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"

    - name: LITELLM_MODE
      value: "PRODUCTION"