fullnameOverride: "litellm"

liteadmin:
  backendUrl: "http://litellm-gateway:4000"

masterKey:
  secretName: litellm-external-secret
  secretKey: masterkey

database:
  writer:
    host: "litellm-postgres-rw:5432/litellm"
    port: 5432
    dbname: litellm
    passwordSecret:
      name: litellm-external-secret
      usernameKey: username
      passwordKey: password

redis:
  host: "litellm-redis"
  port: 6379
  passwordSecret:
    name: litellm-external-secret
    passwordKey: REDIS_PASSWORD

# One host fronting gateway, backend, and UI
ingress:
  enabled: true
  className: "cilium"
  annotations:
    cert-manager.io/cluster-issuer: le-ing-prd
    ingress.cilium.io/loadbalancer-mode: shared
    ingress.cilium.io/websocket: "enabled"
  host: "llm.jcan.dev"
  tls:
    - secretName: litellm-ingress-tls
      hosts:
        - llm.jcan.dev

migrationJob:
  enabled: false

gateway:
  envSecrets:
    - litellm-external-secret

  extraEnv:
    # Authentik OIDC
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: "https://auth.jcan.dev/application/o/authorize/"
    - name: GENERIC_TOKEN_ENDPOINT
      value: "https://auth.jcan.dev/application/o/token/"
    - name: GENERIC_USERINFO_ENDPOINT
      value: "https://auth.jcan.dev/application/o/userinfo/"
    - name: GENERIC_SCOPE
      value: "openid profile email"
    - name: GENERIC_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: litellm-external-secret
          key: GENERIC_CLIENT_ID
    - name: GENERIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: litellm-external-secret
          key: GENERIC_CLIENT_SECRET

    - name: LITELLM_MODE
      value: "PRODUCTION"
    - name: PROXY_BASE_URL
      value: "https://llm.jcan.dev"

  config:
    proxy_config:
      general_settings:
        # Send Admin UI users directly to Authentik instead
        # of displaying LiteLLM's local login page.
        auto_redirect_ui_login_to_sso: true

      model_list:
        - model_name: qwen3-14b
          litellm_params:
            model: hosted_vllm/Qwen/Qwen3-14B-AWQ
            api_base: "http://vllm-qwen3-engine-service.vllm.svc.cluster.local:80/v1"