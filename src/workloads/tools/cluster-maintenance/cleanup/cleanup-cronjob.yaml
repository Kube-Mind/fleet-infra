---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-maintenance
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-maintenance
rules:
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - longhorn.io
    resources:
      - volumes
      - orphans
    verbs:
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-maintenance
subjects:
  - kind: ServiceAccount
    name: cluster-maintenance
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-maintenance
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-maintenance-cleanup
  namespace: kube-system
spec:
  schedule: '0 3 * * *'
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cluster-maintenance
          restartPolicy: Never
          containers:
            - name: cleanup
              image: oci.jcan.dev/library/k8s-utils:26.08.2
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
              args:
                - |
                  set -euo pipefail
                  if ! command -v jq >/dev/null 2>&1; then
                    if command -v apk >/dev/null 2>&1; then
                      apk add --no-cache jq || true
                    fi
                  fi
                  echo 'Deleting stale ReplicaSets...'
                  kubectl get rs -A -o json \
                    | jq -r '.items[] | select((.spec.replicas // 0) == 0 and (.status.replicas // 0) == 0 and (.status.readyReplicas // 0) == 0 and (.status.availableReplicas // 0) == 0) | .metadata.namespace + "/" + .metadata.name' \
                    | while IFS= read -r nsname; do
                        [ -n "$nsname" ] && kubectl delete rs -n "${nsname%%/*}" "${nsname##*/}" || true
                      done

                  echo 'Deleting stale Longhorn volumes...'
                  volumes=$(kubectl -n longhorn get volumes -o json \
                    | jq -r '.items[] | select(.status.state == "detached" and .status.robustness == "unknown") | .metadata.name')
                  if [ -n "$volumes" ]; then
                    printf '%s\n' "$volumes" | xargs -n1 kubectl -n longhorn delete volume
                  fi

                  echo 'Deleting Longhorn orphans...'
                  orphans=$(kubectl get orphans -A -o json | jq -r '.items[] | .metadata.name')
                  if [ -n "$orphans" ]; then
                    printf '%s\n' "$orphans" | xargs -n1 kubectl -n longhorn delete orphan
                  fi

                  echo 'Deleting stale pods...'
                  kubectl get pods -A -o json \
                    | jq -r '.items[] | select([.status.containerStatuses[]? | (.state.terminated.reason // .state.waiting.reason // "")] | any(. == "ContainerStatusUnknown" or . == "ImagePullBackOff" or . == "Error" or . == "Unknown" or . == "Completed")) | .metadata.namespace + "/" + .metadata.name' \
                    | while IFS= read -r nsname; do
                        [ -n "$nsname" ] && kubectl delete pod -n "${nsname%%/*}" "${nsname##*/}" --grace-period=0 --force || true
                      done

                  echo 'Cleanup run complete.'
