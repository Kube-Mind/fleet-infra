apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich

spec:
  instances: 3
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.6-18-trixie

  storage:
    size: 20Gi
    storageClass: longhorn

  managed:
    roles:
      - name: immichuser
        ensure: present
        login: true
        inherit: true
        superuser: true
        connectionLimit: -1

        passwordSecret:
          name: immich-external-secret

  bootstrap:
    initdb:
      database: immichdb
      owner: immichuser

      # Install required extensions ONCE at cluster init
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;